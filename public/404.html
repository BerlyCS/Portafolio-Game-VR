<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Campfire Defense</title>
    <script type="text/javascript">
      // GitHub Pages serves this file for unknown routes. Redirect back to
      // index.html preserving the requested path so the SPA router can handle it.
      var pathSegmentsToKeep = 1
      var l = window.location
      l.replace(
        l.protocol +
          '//' +
          l.hostname +
          (l.port ? ':' + l.port : '') +
          l.pathname
            .split('/')
            .slice(0, 1 + pathSegmentsToKeep)
            .join('/') +
          '/?/' +
          l.pathname
            .slice(1)
            .split('/')
            .slice(pathSegmentsToKeep)
            .join('/')
            .replace(/&/g, '~and~') +
          (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
          l.hash
      )
    </script>
  </head>
  <body></body>
</html>
